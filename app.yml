# GitHub App Manifest for Stale Issue Sweeper
# This can be used with GitHub's manifest flow to register a new app.
# See: https://docs.github.com/en/apps/sharing-github-apps/registering-a-github-app-from-a-manifest

name: stale-issue-sweeper
url: https://github.com/apps/stale-issue-sweeper
hook_attributes:
  url: https://your-app-domain.com/api/github/webhooks
public: true
default_events:
  - issues
  - issue_comment
default_permissions:
  issues: write
  contents: read
  metadata: read
